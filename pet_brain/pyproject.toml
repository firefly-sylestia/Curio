[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "curio-pet-brain"
version = "0.1.0"
description = "Trainable recurrent artificial pet brain and simulator"
requires-python = ">=3.10"
# Install PyTorch separately using the official selector for the target machine.
dependencies = []

[tool.setuptools.packages.find]
where = [".."]
include = ["pet_brain*"]
