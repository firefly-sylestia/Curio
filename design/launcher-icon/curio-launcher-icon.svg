<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
<defs>
  <clipPath id="clip"><rect x="82" y="40" width="860" height="900" rx="155"/></clipPath>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#10184f"/><stop offset="0.62" stop-color="#24164f"/><stop offset="1" stop-color="#a51c68"/>
  </linearGradient>
  <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#b8f6df"/><stop offset="0.72" stop-color="#54d5ca"/><stop offset="1" stop-color="#16a9bd"/>
  </linearGradient>
  <linearGradient id="pink1" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#ff8393"/><stop offset="1" stop-color="#df176e"/>
  </linearGradient>
  <linearGradient id="pink2" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#ff9a8d"/><stop offset="1" stop-color="#ef3978"/>
  </linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#ffe36c"/><stop offset="1" stop-color="#ff8b24"/>
  </linearGradient>
  <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
    <feDropShadow dx="0" dy="12" stdDeviation="12" flood-opacity=".28"/>
  </filter>
  <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>

<g clip-path="url(#clip)">
  <rect x="82" y="40" width="860" height="900" fill="url(#sky)"/>

  <!-- subtle cosmic ribbons -->

  <path d="M65 260 C210 285 270 410 380 355 S650 285 965 430" fill="none" stroke="#7250b4" stroke-width="30" opacity=".14"/>
  <path d="M55 430 C200 455 280 590 405 520 S710 470 975 590" fill="none" stroke="#b93d9c" stroke-width="28" opacity=".13"/>

  <!-- stars -->
  <g fill="#fff7ce">
    <path d="M200 130 l5 16 16 5-16 5-5 16-5-16-16-5 16-5z"/>
   
    <path d="M870 195 l5 16 16 5-16 5-5 16-5-16-16-5 16-5z"/>
   
    <path d="M745 330 l5 17 17 5-17 5-5 17-5-17-17-5 17-5z"/>
    <path d="M230 470 l5 16 16 5-16 5-5 16-5-16-16-5 16-5z"/>
  </g>
  <g fill="#fff">
    <circle cx="210" cy="175" r="3"/><circle cx="390" cy="150" r="4"/><circle cx="530" cy="80" r="3"/>
    <circle cx="760" cy="155" r="4"/><circle cx="900" cy="330" r="3"/><circle cx="160" cy="300" r="4"/>
    <circle cx="345" cy="340" r="3"/><circle cx="690" cy="340" r="3"/><circle cx="825" cy="520" r="4"/>
    <circle cx="510" cy="540" r="3"/><circle cx="280" cy="505" r="3"/>
  </g>
  <g fill="#ffcf5a">
    <circle cx="275" cy="225" r="4"/><circle cx="480" cy="190" r="3"/><circle cx="790" cy="290" r="4"/>
    <circle cx="590" cy="515" r="3"/><circle cx="440" cy="390" r="3"/>
  </g>

 
  <!-- main planet -->
  <g filter="url(#shadow)">
    <circle cx="380" cy="320" r="122" fill="url(#mint)" stroke="#d9fff3" stroke-width="5"/>
    <ellipse cx="380" cy="220" rx="40" ry="17" fill="#eafff7" opacity=".72" transform="rotate(-24 460 325)"/>
   
  </g>

  <!-- small moon -->
  <g filter="url(#shadow)">
    <circle cx="650" cy="500" r="55" fill="url(#pink1)" stroke="#ffd0d7" stroke-width="4"/>
    <ellipse cx="632" cy="480" rx="19" ry="8" fill="#fff1f2" opacity=".8" transform="rotate(-28 632 480)"/>
  </g>

  <!-- layered waves -->
  <path d="M60 550 C205 475 300 690 420 650 C570 600 660 690 790 650 C870 635 939 520 970 630 L970 940 L60 940Z"
        fill="url(#pink1)" stroke="#ffd0a5" stroke-width="5"/>
  <path d="M60 660 C205 570 315 790 455 745 C610 695 700 785 830 745 C900 724 945 725 970 750 L970 940 L60 940Z"
        fill="url(#pink2)" stroke="#ffe4a7" stroke-width="5"/>
  <path d="M60 800 C205 685 320 895 470 850 C610 815 745 900 875 855 C920 840 950 840 970 850 L970 940 L60 940Z"
        fill="url(#gold)" stroke="#fff09b" stroke-width="5"/>
</g>

<rect x="82" y="40" width="860" height="900" rx="155" fill="none" stroke="#ffffff" stroke-opacity=".8" stroke-width="5"/>
</svg>