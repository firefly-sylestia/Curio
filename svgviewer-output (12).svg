<svg xmlns="http://www.w3.org/2000/svg"
     width="150"
     height="420"
     viewBox="0 0 150 420">

  <defs>
    <!-- 3D metallic tube -->
    <linearGradient id="metal"
                    x1="0%" y1="0%"
                    x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#1c2937"/>
      <stop offset="12%"  stop-color="#52687d"/>
      <stop offset="28%"  stop-color="#dce9f6"/>
      <stop offset="42%"  stop-color="#8196aa"/>
      <stop offset="55%"  stop-color="#ffffff"/>
      <stop offset="70%"  stop-color="#9caec0"/>
      <stop offset="88%"  stop-color="#43586c"/>
      <stop offset="100%" stop-color="#172432"/>
    </linearGradient>

    <linearGradient id="darkMetal"
                    x1="0%" y1="0%"
                    x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0e1822"/>
      <stop offset="50%" stop-color="#53687c"/>
      <stop offset="100%" stop-color="#101b26"/>
    </linearGradient>
  </defs>


  <!-- ========================= -->
  <!-- COIL 1 -->
  <!-- ========================= -->

  <!-- dark depth behind tube -->
  <path
    d="M38 62
       C38 39 54 24 76 24
       C98 24 111 37 111 52
       "
    fill="none"
    stroke="#101b27"
    stroke-width="18"
    stroke-linecap="round"
    stroke-linejoin="round"/>

  <!-- main 3D spiral -->
  <path
    d="M38 62
       C38 39 54 24 76 24
       C98 24 111 37 111 52
  
       "
    fill="none"
    stroke="url(#metal)"
    stroke-width="13"
    stroke-linecap="round"
    stroke-linejoin="round"/>

  <!-- highlight -->
  <path
    d="M43 57
       C45 39 58 29 76 29
       C92 29 103 37 106 48"
    fill="none"
    stroke="#ffffff"
    stroke-width="3"
    stroke-linecap="round"
    opacity=".75"/>


  <!-- ========================= -->
  <!-- COIL 2 -->
  <!-- ========================= -->

  <path
    d="M38 202
       C38 179 54 164 76 164
       C98 164 111 177 111 192
       "
    fill="none"
    stroke="#101b27"
    stroke-width="18"
    stroke-linecap="round"
    stroke-linejoin="round"/>

  <path
    d="M38 202
       C38 179 54 164 76 164
       C98 164 111 177 111 192
     "
    fill="none"
    stroke="url(#metal)"
    stroke-width="13"
    stroke-linecap="round"
    stroke-linejoin="round"/>

  <path
    d="M43 197
       C45 179 58 169 76 169
       C92 169 103 177 106 188"
    fill="none"
    stroke="#ffffff"
    stroke-width="3"
    stroke-linecap="round"
    opacity=".75"/>


  <!-- ========================= -->
  <!-- COIL 3 -->
  <!-- ========================= -->

  <path
    d="M38 342
       C38 319 54 304 76 304
       C98 304 111 317 111 332
      "
    fill="none"
    stroke="#101b27"
    stroke-width="18"
    stroke-linecap="round"
    stroke-linejoin="round"/>

  <path
    d="M38 342
       C38 319 54 304 76 304
       C98 304 111 317 111 332
       "
    fill="none"
    stroke="url(#metal)"
    stroke-width="13"
    stroke-linecap="round"
    stroke-linejoin="round"/>

  <path
    d="M43 337
       C45 319 58 309 76 309
       C92 309 103 317 106 328"
    fill="none"
    stroke="#ffffff"
    stroke-width="3"
    stroke-linecap="round"
    opacity=".75"/>

</svg>