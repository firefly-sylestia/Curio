name: Diagnose the Kotlin non-local-return artifact

# TEMPORARY diagnostic. The release build's R8 step fails with:
#   Method name '<anonymous>' in class '$$$$$NON_LOCAL_RETURN$$$$$'
#   cannot be represented in dex format  (origin: PersonalCanvasKt.class)
#
# Reading the source has not found the construct that emits that class, so this
# job compiles the release Kotlin and prints, for every class that mentions the
# sentinel, the METHOD it appears in. Delete this file once the fix has landed.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: Find the sentinel's owner
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out Curio
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Compile the release Kotlin only
        run: |
          set -o pipefail
          ./gradlew :app:compileReleaseKotlin -PcurioAbiSplits=false --stacktrace 2>&1 | tail -40 || true

      - name: Report every class that mentions the sentinel
        run: |
          set -uo pipefail
          classes=app/build/intermediates/built_in_kotlinc/release/compileReleaseKotlin/classes
          echo "classes dir: $classes"
          ls "$classes" 2>/dev/null | head -5
          cd "$classes" || exit 0
          hits=$(grep -rl 'NON_LOCAL_RETURN' . || true)
          echo "== class files mentioning the sentinel =="
          echo "$hits"
          echo
          for f in $hits; do
            echo "=============================================================="
            echo "=== $f"
            javap -p -c "$f" > /tmp/dis.txt 2>&1 || true
            echo "-- methods whose bytecode carries it:"
            awk '/^  [^ ].*\(.*\)/ { m=$0 } /NON_LOCAL_RETURN/ { print "   IN: " m; print "      " $0 }' /tmp/dis.txt | head -60
            echo "-- first 40 lines of the disassembly:"
            head -40 /tmp/dis.txt
            echo
          done
