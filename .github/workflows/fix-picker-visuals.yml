name: Apply picker visual cleanup

on:
  push:
    paths:
      - '.github/workflows/fix-picker-visuals.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply neutral Material picker styling
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          files = [
              Path('app/src/main/java/com/curio/app/features/picker/NewCategoryPicker.kt'),
              Path('app/src/main/java/com/curio/app/features/picker/NewCategoryPickerBrowse.kt'),
          ]

          def replace_all(s, old, new):
              if old in s:
                  return s.replace(old, new)
              return s

          for path in files:
              s = path.read_text()

              # Picker controls must not use category-colored outlines/glass edges.
              s = replace_all(s, '.curioGlassEdge(shape)', '')

              # Remove category wash/cream surfaces from picker screens and sheets.
              s = replace_all(s, 'background(washCat.categoryBackgroundWash())', 'background(MaterialTheme.colorScheme.surface)')
              s = replace_all(s, 'containerColor = washCat.categoryBackgroundWash()', 'containerColor = MaterialTheme.colorScheme.surfaceContainerLow')

              # Category accent colors are not used for component borders or fills.
              s = replace_all(s, 'val catAccent = category.themedAccent()', 'val catAccent = MaterialTheme.colorScheme.primary')
              s = replace_all(s, 'cat?.themedAccent() ?: MaterialTheme.colorScheme.primary', 'MaterialTheme.colorScheme.onSurfaceVariant')
              s = replace_all(s, 'category.themedAccent()', 'MaterialTheme.colorScheme.primary')
              s = replace_all(s, 'category.themedAccent().copy(alpha = 0.8f)', 'MaterialTheme.colorScheme.onSurfaceVariant')

              # Primary picker actions use Material theme roles rather than the current category.
              s = replace_all(s, 'accent = washCat.themedAccent(),\n                    accentInk = washCat.onAccent(),', 'accent = MaterialTheme.colorScheme.primary,\n                    accentInk = MaterialTheme.colorScheme.onPrimary,')
              s = replace_all(s, 'accent = washCat.themedButtonFill(),\n                accentInk = washCat.themedButtonInk(),', 'accent = MaterialTheme.colorScheme.primary,\n                accentInk = MaterialTheme.colorScheme.onPrimary,')

              # Neutralize category tiles: no category border/ring, no creamy tint.
              s = replace_all(s, '''    val fill = when {\n        selected -> lerp(MaterialTheme.colorScheme.surfaceContainerHigh, catAccent, 0.16f)\n        else -> MaterialTheme.colorScheme.surfaceContainerHigh\n    }''', '''    val fill = if (selected) {\n        MaterialTheme.colorScheme.secondaryContainer\n    } else {\n        MaterialTheme.colorScheme.surfaceContainerHigh\n    }''')

              s = re.sub(r'''\n            // Thin accent ring for selection, lighter ring for pin\.\n            \.border\(\n                width = if \(selected\) 2\.dp else if \(pinned\) 1\.5\.dp else 0\.dp,\n                color = if \(selected\) catAccent\.copy\(alpha = 0\.9f\)\n                        else catAccent\.copy\(alpha = 0\.45f\),\n                shape = shape\n            \)''', '', s)

              # Neutral icon plates and ink.
              s = re.sub(r'\.background\(lerp\(fill, catAccent, if \(selected\) 0\.20f else 0\.08f\)\)', '.background(if (selected) MaterialTheme.colorScheme.onSecondaryContainer.copy(alpha = 0.10f) else MaterialTheme.colorScheme.surfaceContainerHighest)', s)
              s = replace_all(s, 'tint = if (comingSoon) MaterialTheme.colorScheme.onSurfaceVariant.copy(alpha = 0.45f)\n                        else catAccent', 'tint = if (comingSoon) MaterialTheme.colorScheme.onSurfaceVariant.copy(alpha = 0.45f)\n                        else MaterialTheme.colorScheme.onSurfaceVariant')
              s = replace_all(s, 'selected -> catAccent\n                        comingSoon', 'selected -> MaterialTheme.colorScheme.onSecondaryContainer\n                        comingSoon')
              s = replace_all(s, 'color = if (selected) catAccent', 'color = if (selected) MaterialTheme.colorScheme.onSecondaryContainer')

              # Selected check is a normal Material primary state, not a category state.
              s = replace_all(s, '.background(catAccent)', '.background(MaterialTheme.colorScheme.primary)')
              s = replace_all(s, 'tint = category.onAccent()', 'tint = MaterialTheme.colorScheme.onPrimary')

              # Neutralize icon badges/plates in pins and mix rows.
              s = replace_all(s, '.background(lerp(MaterialTheme.colorScheme.surfaceContainerHigh, cat?.themedAccent() ?: MaterialTheme.colorScheme.primary, 0.10f))', '.background(MaterialTheme.colorScheme.surfaceContainerHighest)')
              s = replace_all(s, '.background(lerp(fill, catAccent, 0.14f))', '.background(MaterialTheme.colorScheme.surfaceContainerHighest)')

              # Bottom navigation: no category tint, no liquid-glass edge/capsule.
              s = replace_all(s, 'val glassOn = backdrop != null && isLiquidGlassPillsActive()\n    val fill = if (selected) lerp(MaterialTheme.colorScheme.surfaceContainerHigh, accent, 0.22f)\n    else MaterialTheme.colorScheme.surfaceContainerHigh', 'val glassOn = false\n    val fill = if (selected) MaterialTheme.colorScheme.secondaryContainer\n    else MaterialTheme.colorScheme.surfaceContainerHigh')
              s = re.sub(r'''\n            \.then\(\n                if \(glassOn\) Modifier\.liquidGlassCapsule\(\n                    fill,\n                    backdrop = backdrop,\n                    shape = shape,\n                    compact = true\n                \)\n                else Modifier\n            \)''', '', s)
              s = replace_all(s, 'tint = if (selected) accent else MaterialTheme.colorScheme.onSurfaceVariant', 'tint = if (selected) MaterialTheme.colorScheme.onSecondaryContainer else MaterialTheme.colorScheme.onSurfaceVariant')
              s = replace_all(s, 'color = if (selected) accent else MaterialTheme.colorScheme.onSurface', 'color = if (selected) MaterialTheme.colorScheme.onSecondaryContainer else MaterialTheme.colorScheme.onSurface')

              # Neutral buttons in mix rows/pins.
              s = replace_all(s, 'color = cat?.themedAccent() ?: MaterialTheme.colorScheme.primary', 'color = MaterialTheme.colorScheme.primary')
              s = replace_all(s, 'color = cat?.onAccent() ?: MaterialTheme.colorScheme.onPrimary', 'color = MaterialTheme.colorScheme.onPrimary')

              path.write_text(s)
          PY

      - name: Remove temporary workflow
        run: |
          rm -f .github/workflows/fix-picker-visuals.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/curio/app/features/picker/NewCategoryPicker.kt app/src/main/java/com/curio/app/features/picker/NewCategoryPickerBrowse.kt
          git add -u .github/workflows/fix-picker-visuals.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Fix category picker Material styling'
          git push
