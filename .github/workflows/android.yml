name: Curio Android CI

on:
  push:
    branches: [main, Alpha]
  pull_request:
    branches: [main, Alpha]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: curio-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ─────────────────────────────────────────────────────────────────────────────
# THE RUN HAS FOUR SURFACES (v405)
#
# The run page used to be one long job whose only output was a wall of Gradle
# log. It now answers four questions in four places, because each of them is
# read by a different person at a different moment:
#
#   1. THE SUMMARY (this page, bottom) — "what did this build actually do?" A
#      table of the verdict, the version, the catalogs bundled, the
#      warning/error counts, the signing story and the APK's size and SHA-256
#      — and, when the build FAILED, the failed Gradle tasks and the first
#      compiler errors lifted out of the log (v412). Written by
#      `.github/scripts/build-summary.sh`, rendered by GitHub from
#      `$GITHUB_STEP_SUMMARY`.
#   2. THE CHECKS TAB — the Kotlin compiler's own `e:`/`w:` lines re-emitted as
#      ANNOTATIONS (`::error`/`::warning` with a file, line and column), so a
#      warning is a clickable row on the changed file instead of a line in a
#      12,000-line log. Written by `.github/scripts/annotate-gradle.sh`.
#   3. THE REPORT JOB — one check whose whole body is the summary, so the run's
#      list reads "Curio Android CI / Curio CI report" next to the build, and a
#      reviewer who opens only the report still sees everything.
#   4. THE PULL REQUEST — the same summary as an upserted comment, for a
#      same-repo PR only (a fork PR's token is read-only, so it is skipped).
#
# ── v466 — FOUR RUNNERS: TWO EDITIONS, TWO PHASES ───────────────────────────
#
# Measured from a green run's own log, not guessed. The job wall was 1056s and
# 1007s of that was ONE Gradle invocation, inside which:
#
#     lintReportCoreRelease   ~400s   (40%)
#     minifyCoreReleaseWithR8 ~362s   (36%)
#     compileCoreReleaseKotlin ~155s  (15%)
#
# ...and lint ran LAST, after the APK was already built, signed and verified.
# It was 40% of the WORK and NONE of the critical path — pure tail on a job
# that had already answered its question. So each edition now has TWO jobs:
#
#     build  → ksp · kotlin · R8 · package · sign · verify   ~9.0 min
#     lint   → ksp · kotlin · lintReport                     ~9.7 min
#
# starting together, so the critical path is max(build, lint) ≈ 10 min instead
# of build + lint = 17.6. The cost is honest and worth stating: four runners
# instead of two, and the Kotlin compile is performed twice per edition (lint
# needs the same compiled classes the build does, and neither job can borrow
# the other's, because they run at the same time).
#
# The APK is UNCHANGED by this. Nothing about the release artifact is
# different for being built on its own runner — the same tasks, the same
# flags, the same signing config. See the "what is NOT here" note on the build
# job for the levers that were considered and rejected.
# ─────────────────────────────────────────────────────────────────────────────

jobs:
  # ── PHASE 1 of 2: THE BUILD RUNNER ──────────────────────────────────────
  #
  # One edition, and nothing but the APK: ksp · Kotlin · R8 · package · sign ·
  # verify. Lint moved to the `lint` job below (v466 — see the header note); it
  # is not invoked here, which is what makes this runner ~9 minutes instead of
  # ~17.6.
  build:
    name: Curio Android · ${{ matrix.edition }} · build
    runs-on: ubuntu-latest
    # ── v465e — ONE EDITION PER RUNNER, STARTING TOGETHER ────────────────────
    #
    # The member: *"start the workflow build of the two version in a separate …
    # make it start simultaneously"*. One job built both editions in a single
    # Gradle invocation, which is why a run took ~30 minutes; a matrix puts one
    # edition on each runner so they compile at the same time and wall-clock
    # roughly halves, at the cost of the fixed per-job overhead (checkout, JDK,
    # SDK, catalog bundling) being paid twice.
    #
    # `fail-fast: false` ON PURPOSE: this job's whole job is proving that BOTH
    # editions still build, and fail-fast would cancel `full` the moment `core`
    # broke — which is the one run where the second answer is most wanted.
    #
    # ⚠️ NO JOB-LEVEL `outputs:` HERE, AND THAT IS THE POINT. This used to
    # publish eleven step outputs for the standalone report job to quote. A
    # MATRIX JOB CANNOT OFFER A SINGLE JOB'S OUTPUTS — `needs.build.outputs`
    # becomes an aggregation whose winner GitHub does not specify, so a roll-up
    # built on it would print one edition's numbers under a heading implying
    # both. Each edition therefore WRITES its row to `ci-report/` and uploads it
    # (see build-summary.sh and run-report.py); the report merges artifacts.
    # Do not reintroduce `needs.build.outputs.*` in the report job.
    #
    # v466 — AND `needs` IS A LIST NOW, for the same reason: the report rolls up
    # FOUR rows (two editions × build|lint), and every one of them is written by
    # a matrixed job.
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: core
            # The Gradle task's own capitalisation: `assembleCoreRelease`.
            cap: Core
          - edition: full
            cap: Full
    # v465c — 60 minutes, not 45: the FULL edition links a vendored 48 MB
    # native AAR (sherpa-onnx) and R8 has to process it whole. The 45-minute
    # ceiling was set when the only extra weight was Vosk; a timeout that binds
    # on the build that is supposed to take longest is a timeout that fails a
    # healthy run, which is worse than a generous one.
    #
    # v466 — UNCHANGED by the lint split, deliberately. This runner no longer
    # lints, so 60 is now slack rather than a bound; but a ceiling that has
    # never been hit is not worth tightening on a build nobody has timed with
    # the other three jobs competing for runner capacity. The `lint` job below
    # gets its own, tighter, because lint's cost IS known (~10 minutes).
    timeout-minutes: 60

    steps:
      - name: Check out Curio
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Decode release keystore when signing secrets are available
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Release signing secrets not available (fork PR or unconfigured repo) — release APK will use the debug-signing fallback."
            echo "decoded=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > release.keystore
          size=$(wc -c < release.keystore)
          if [ "$size" -lt 100 ]; then
            echo "::error::Decoded release keystore is unexpectedly small (${size} bytes)."
            exit 1
          fi
          echo "Release keystore decoded (${size} bytes)."
          echo "decoded=true" >> "$GITHUB_OUTPUT"

      # Bundle the source catalogs as Android assets. The app imports these JSON
      # files into its user database on first launch (and retries for existing
      # installs whose previous import produced zero rows). The per-file record
      # goes into the summary — an empty or truncated catalog is the one failure
      # this step exists to catch, and it is invisible in a log line count.
      - name: Bundle the topic catalogs
        id: topics
        run: |
          set -euo pipefail
          rm -rf app/src/main/assets/topics
          mkdir -p app/src/main/assets/topics
          cp data/topics/*.json app/src/main/assets/topics/
          catalogs=$(find app/src/main/assets/topics -maxdepth 1 -name '*.json' | wc -l)
          if [ "$catalogs" -eq 0 ]; then
            echo "::error::No topic JSON assets were bundled."
            exit 1
          fi
          topics=$(python3 - <<'PY'
          import glob, json
          total = 0
          for path in glob.glob("app/src/main/assets/topics/*.json"):
              with open(path, encoding="utf-8") as handle:
                  data = json.load(handle)
              total += len(data if isinstance(data, list) else data.get("topics", []))
          print(total)
          PY
          )
          echo "catalogs=${catalogs}" >> "$GITHUB_OUTPUT"
          echo "topics=${topics}" >> "$GITHUB_OUTPUT"
          echo "Bundled ${catalogs} catalog files carrying ${topics} topics."

      # PR/push CI builds ONE universal release APK (curioAbiSplits=false
      # disables the per-ABI split packaging in app/build.gradle.kts).
      # The tag release workflow builds the full universal + per-ABI set.
      #
      # v412 — the job compiles ONE variant, not two: `assembleRelease` was
      # the build, and lint ran `lintRelease` so it REUSED the release
      # compilation `assembleRelease` just did instead of compiling the
      # debug variant a second time (~half the Kotlin work per run). That
      # pairing is what v466 unpicks — see the note on the task list below.
      #
      # v465b — with the `edition` flavor dimension, `assembleRelease` is
      # AMBIGUOUS: Gradle refuses to pick between `assembleCoreRelease` and
      # `assembleFullRelease` and fails at TASK SELECTION, before a single
      # line compiles ("Task 'lintRelease' is ambiguous in root project
      # 'Curio' and its subprojects"). So the task is spelled out per edition.
      #
      # `continue-on-error` so the annotation and summary steps below still run
      # on a FAILED build — the compiler's own errors are exactly what the
      # Checks tab should be showing — and the outcome is re-failed by the gate
      # step after them.
      - name: Validate the topics and build the release APK
        id: build
        continue-on-error: true
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          # v354 — optional: free Google Books API key. When the secret is
          # present it is baked into BuildConfig.GOOGLE_BOOKS_API_KEY and the
          # book fetchers append &key= for the higher quota; unset stays keyless.
          GOOGLE_BOOKS_API_KEY: ${{ secrets.GOOGLE_BOOKS_API_KEY }}
          # v356 — optional: free LibraryThing developer key. When present it
          # is baked into BuildConfig.LIBRARY_THING_API_KEY and the hub shows
          # the LibraryThing cover source; unset hides it (keyless providers
          # keep working).
          LIBRARY_THING_API_KEY: ${{ secrets.LIBRARY_THING_API_KEY }}
          # v358 — optional: Spotify developer credentials. When present they
          # are baked into BuildConfig and music topics deep-link to real
          # open.spotify.com items (client-credentials flow); unset keeps the
          # search links.
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          # v389f — optional: free TMDB API key. When present it is baked into
          # BuildConfig.TMDB_API_KEY and the film / anime sheets resolve their
          # artwork (and a film's facts, and the episodes of a title that is
          # really a show) from TMDB first; unset stays on the keyless
          # providers (iTunes, TVMaze, Jikan).
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          # v428 — optional: TMDB's OTHER credential, the "API Read Access
          # Token" (a JWT, sent as `Authorization: Bearer …` and valid on v3 and
          # v4 alike). Either secret on its own is enough — the token is read
          # first, and a JWT in the key field is recognised as one.
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
          # v426 — optional: free Comic Vine key (non-commercial use). When
          # present it is baked into BuildConfig.COMIC_VINE_API_KEY and the
          # comics sources ask it FIRST for a Comic and LAST for a manga, so a
          # Western comic resolves its own cover, publisher, year and issue
          # count; unset stays on the keyless comics sources.
          COMIC_VINE_API_KEY: ${{ secrets.COMIC_VINE_API_KEY }}
          # v428b — optional: free OMDb key (1,000 requests/day). When present it
          # is baked into BuildConfig.OMDB_API_KEY and a film or a series that
          # TMDB could not answer for gets its plot, poster, rating and runtime
          # from OMDb before the keyless doors are tried; unset changes nothing.
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
          # Supabase (account sign-in + Online Mode backend). The project URL
          # and the publishable/anon key are PUBLIC client credentials and are
          # baked into BuildConfig; the service-role key must NEVER be added
          # here or anywhere else in this workflow. Unset leaves
          # SupabaseClient.isConfigured false, so Online Mode reports
          # unconfigured instead of crashing.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          # Either secret name is accepted — app/build.gradle.kts reads
          # SUPABASE_PUBLISHABLE_KEY first and falls back to SUPABASE_ANON_KEY,
          # so the build works whichever name the repository uses.
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          # The Curio account site (auth-web/), where confirmation and password
          # reset emails send people. Optional: unset (empty) leaves Supabase's
          # own Site URL in charge and hides the app's password-recovery row.
          CURIO_AUTH_SITE_URL: ${{ secrets.CURIO_AUTH_SITE_URL }}
        run: |
          set -o pipefail
          if [ -z "$SUPABASE_URL" ] || { [ -z "$SUPABASE_PUBLISHABLE_KEY" ] && [ -z "$SUPABASE_ANON_KEY" ]; }; then
            echo "::warning::Supabase URL/key secrets not provided — this build's Online Mode will report unconfigured."
          else
            echo "Supabase project URL + publishable key were provided to the build."
          fi
          # v465e — ONE EDITION's tasks, from the matrix. `${{ matrix.cap }}` is
          # `Core`/`Full` to match Gradle's own task capitalisation. Each edition
          # is named explicitly — the bare `assembleRelease` name is ambiguous
          # under the flavor dimension and fails at task selection, so CI is the
          # thing that proves BOTH editions build.
          #
          # v466 — NO `lint<Cap>Release` HERE. It was paired with the assemble on
          # purpose, so the assemble could reuse the variant's compilation; that
          # is why this runner took 17.6 minutes. Lint now has its own job, and
          # the compile it needs happens there instead of at the end of a build
          # that had already produced its APK. `validateTopics` stays: an empty
          # topic catalog is the one failure that has already shipped an APK with
          # no data (v412), and a build runner that does not check it is a build
          # runner that will happily package the empty one.
          ./gradlew validateTopics assemble${{ matrix.cap }}Release -PcurioAbiSplits=false --stacktrace 2>&1 \
            | tee gradle-build.log

      # ── SURFACE 2: THE CHECKS TAB ────────────────────────────────────────
      # Every Kotlin diagnostic in the log becomes a real annotation. Nothing
      # here can fail the run: it is a reader of the log, not a check.
      #
      # v466 — its `errors`/`warnings` step outputs are gone along with the lint
      # totals step (nothing read them any more), but the annotations are the
      # reason this step existed and they are untouched.
      - name: Publish compiler diagnostics as check annotations
        id: annotate
        if: always()
        run: |
          set -uo pipefail
          chmod +x .github/scripts/annotate-gradle.sh .github/scripts/build-summary.sh
          .github/scripts/annotate-gradle.sh gradle-build.log

      # ── SURFACE 1: THE SUMMARY ─────────────────────────────────────────────
      - name: Verify release APKs and signatures
        id: apk
        if: steps.build.outcome == 'success' && steps.keystore.outputs.decoded == 'true'
        run: |
          set -euo pipefail
          shopt -s nullglob
          # v465 — one directory per edition: the `edition` flavor dimension
          # moved the outputs from `apk/release/` to `apk/<flavor>/release/`, so
          # the extra level is part of the glob now.
          #
          # v465e — NARROWED TO THIS RUNNER'S EDITION. The wildcard would still
          # find the right directory (one edition builds here), but naming it
          # means a mis-set matrix axis fails as "no APK" instead of silently
          # checking the OTHER edition's output and passing.
          apks=(app/build/outputs/apk/${{ matrix.edition }}/release/*.apk)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "::error::No signed release APK was produced."
            exit 1
          fi
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          apksigner=$(find "$sdk_root/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          if [ -z "$apksigner" ]; then
            echo "::error::Android build-tools apksigner was not found."
            exit 1
          fi
          for apk in "${apks[@]}"; do
            echo "Release APK: $apk"
            "$apksigner" verify --print-certs "$apk"
            if "$apksigner" verify --print-certs "$apk" 2>&1 | grep -q 'CN=Android Debug'; then
              echo "::error::Release APK $apk is signed with the Android debug key."
              exit 1
            fi
          done
          # v465 — every APK found is NAMED, not just the first, because a
          # release build emits a universal APK AND one per ABI.
          #
          # v465e — this runner holds ONE edition, so there is no longer a
          # question of which edition a size refers to; the count is the ABI set.
          apk="${apks[0]}"
          names=""
          for one in "${apks[@]}"; do
            if [ -n "$names" ]; then names="$names, "; fi
            names="$names$(basename "$one")"
          done
          echo "name=${names}" >> "$GITHUB_OUTPUT"
          echo "size=$(du -h "$apk" | cut -f1) (first of ${#apks[@]})" >> "$GITHUB_OUTPUT"
          echo "sha=$(sha256sum "$apk" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "signature=release keystore" >> "$GITHUB_OUTPUT"
          echo "Verified ${#apks[@]} release APK(s) — none signed with the debug key."

      # v466 — "Read the lint totals" lived here. It read the lint report to
      # publish `errors`/`warnings` step outputs, and BOTH of its readers are
      # gone: the lint report is not on this runner any more, and the report job
      # reads artifact rows rather than step outputs (v465e). Its work moved to
      # the lint job, where the report actually exists.

      - name: Write the run summary
        id: summary
        if: always()
        env:
          DECODED: ${{ steps.keystore.outputs.decoded }}
          APK_SIGNATURE: ${{ steps.apk.outputs.signature }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          set -uo pipefail
          version_code=$(grep -oE 'versionCode[[:space:]]*=[[:space:]]*[0-9]+' app/build.gradle.kts | grep -oE '[0-9]+' | head -1)
          version_name=$(grep -oE 'envReleaseVersion \?: "[0-9.]+"' app/build.gradle.kts | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          if [ -n "$APK_SIGNATURE" ]; then
            signature="$APK_SIGNATURE"
          elif [ "$DECODED" == "true" ]; then
            signature="release keystore (no APK to verify)"
          else
            signature="debug-key fallback (no keystore secrets)"
          fi
          # v412 — the outcome rides along so the summary can open with the
          # verdict and, on a failure, carry the failed tasks and the first
          # compiler errors (see build-summary.sh's postmortem block).
          #
          # v465e — and the EDITION, which is what tells the script to read this
          # runner's APK directory rather than every edition's.
          #
          # v466 — and the PHASE (`build`), which is what makes it write
          # `ci-report/curio-<edition>-<phase>.json` and keep its Lint row from
          # saying "no report" about a runner that was never asked to lint.
          chmod +x .github/scripts/run-report.py
          .github/scripts/build-summary.sh "$signature" "$BUILD_OUTCOME" "${{ matrix.edition }}" "build"
          echo "version=${version_name:-1.1.1} (${version_code:-20260922})" >> "$GITHUB_OUTPUT"
          echo "signature=${signature}" >> "$GITHUB_OUTPUT"

      - name: Fail the run when the build failed
        if: steps.build.outcome == 'failure'
        run: |
          echo "::error::The Gradle build failed — see the annotations above and the uploaded log."
          exit 1

      - name: Upload the Gradle log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: curio-gradle-log-${{ matrix.edition }}-${{ github.run_number }}
          path: gradle-build.log
          if-no-files-found: ignore
          retention-days: 1

      # v466 — "Upload lint reports" moved to the lint job. There is no lint
      # report on a build runner, so the step here had been uploading nothing
      # (`if-no-files-found: ignore`) since the split.

      - name: Upload release APKs
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: curio-pr-release-apks-${{ matrix.edition }}-${{ github.run_number }}
          # v465 — one directory per edition (apk/<flavor>/release/).
          # v465e — this runner's directory only, so the two editions' artifacts
          # never collide on one name and stay tellable apart in the run.
          path: app/build/outputs/apk/${{ matrix.edition }}/release/*.apk
          if-no-files-found: error
          # v26 — CI PR/push APKs are throwaway test builds: shrink to the
          # minimum so artifact storage barely accumulates. The official
          # APKs attached to tag RELEASES (release.yml) stay permanent.
          retention-days: 1

      # ── v465e — THIS JOB'S ROW, FOR THE REPORT JOB ──────────────────────
      # Written by build-summary.sh above, even on a failed build, because
      # "which edition broke" is the first question a red run has to answer.
      # `if: always()` so the row exists whatever happened before it.
      #
      # v466 — THE ARTIFACT NAME CARRIES THE PHASE, because there are four rows
      # now and two of them come from the SAME edition. `curio-ci-report-core`
      # from a build runner and from a lint runner would be one artifact name
      # with two writers: upload-artifact would then either collide or merge them
      # by luck of ordering, and the report would quote whichever landed second
      # under a heading naming neither.
      - name: Upload this job's report row
        id: report_row
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: curio-ci-report-${{ matrix.edition }}-build
          path: ci-report/curio-${{ matrix.edition }}-build.json
          if-no-files-found: warn
          retention-days: 1

      - name: Note the signing fallback
        if: steps.keystore.outputs.decoded != 'true'
        run: |
          {
            echo ""
            echo "> Signing: **debug-key fallback** — no \`KEYSTORE_*\` secrets reached this run"
            echo "> (a fork PR, or an unconfigured repository). A published release never falls back."
          } >> "$GITHUB_STEP_SUMMARY"

  # ── PHASE 2 of 2: THE LINT RUNNER ───────────────────────────────────────
  #
  # v466 — LINT'S OWN JOB, AND THE WHOLE REASON THE RUN GETS FASTER.
  #
  # From the green run's log (see the header note): `lintReportCoreRelease` was
  # ~400 of the ~1007 seconds one Gradle invocation took — 40% of the job — and
  # it ran LAST, after the APK had already been built, signed and verified. It
  # contributed nothing to the critical path and everything to the wall clock.
  #
  # Running it here, beside the build, turns the critical path from
  # `build + lint` into `max(build, lint)`. Measured: ~9.0 minutes of build
  # against ~9.7 minutes of lint, so the run lands near 10 minutes instead of
  # 17.6 — about 43% off every push and PR, with the same APK and the same lint
  # signal.
  #
  # ⚠️ WHAT THIS COSTS, stated plainly: four runners instead of two, and the
  # Kotlin compile is done TWICE per edition. Lint needs the same compiled
  # classes the build produces, and the two jobs run simultaneously — so neither
  # can borrow the other's output, and neither can share a Gradle cache key
  # (the action keys on the job context). That duplicated compile (~155s) is the
  # price of not serialising the other ~400s.
  #
  # It lints the RELEASE variant only, matching what the build ships: a lint
  # finding that only exists in a debug-only source set is not a finding about
  # the artifact anyone installs.
  lint:
    name: Curio Android · ${{ matrix.edition }} · lint
    runs-on: ubuntu-latest
    strategy:
      # Same reasoning as the build job: this job's whole job is proving both
      # editions are clean, so a `core` finding must not cancel `full`. A warning
      # is a warning in EVERY edition or it is not a warning about releasing.
      fail-fast: false
      matrix:
        include:
          - edition: core
            cap: Core
          - edition: full
            cap: Full
    # ~10 minutes observed, so 45 is pure headroom against a runner that is
    # slow rather than against a task that is unbounded. Not 60: this job has no
    # R8 and no 48 MB native AAR to process, and a ceiling shared with the
    # build would hide exactly the regression this job could introduce.
    timeout-minutes: 45

    steps:
      - name: Check out Curio
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # THREE DELIBERATE DIFFERENCES FROM THE BUILD JOB'S SETUP, and each one is
      # the member's "faster with cache or something" answered honestly rather
      # than decoratively:
      #
      #  * `cache-read-only: true` — the action's teardown is what uploads the
      #    Gradle user home, and on the green run that teardown was 24.6s of a
      #    1056s job. THIS job does not need to be the one that saves the cache:
      #    both editions' build runners save it, and this runner's restored
      #    entry is the same `~/.gradle/caches`. Read-only means it still gets
      #    the speed-up and pays none of the upload. (It also removes a
      #    concurrent writer racing the two build runners' saves.)
      #  * NO keystore decode — lint does not assemble, sign or verify an APK,
      #    so fetching and decoding the release keystore here would be three
      #    seconds and a secret touched for nothing.
      #  * NO topic-catalog check — that belongs to the thing that bundles the
      #    catalogs into the APK, and running it twice would report the same
      #    fact twice under two headings.
      - name: Set up Gradle (restore only — the build runners save)
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Lint the release variant
        id: lint_build
        continue-on-error: true
        run: |
          set -o pipefail
          # `lint<Cap>Release` runs the variant's compile as a dependency, which
          # is the ~155s duplication this job accepts in exchange for lifting
          # the ~400s lint phase off the build runner's tail.
          ./gradlew lint${{ matrix.cap }}Release --stacktrace 2>&1 | tee gradle-lint.log

      # The Kotlin diagnostics from THIS job's compile, as annotations. The build
      # runner annotates the same source, so a compile error can appear on both
      # jobs' Checks entries — which is honest (both really did fail to compile
      # it) and far better than the alternative of this runner's log being
      # readable only by downloading an artifact.
      - name: Publish compiler diagnostics as check annotations
        if: always()
        run: |
          set -uo pipefail
          chmod +x .github/scripts/annotate-gradle.sh
          .github/scripts/annotate-gradle.sh gradle-lint.log

      # v466 — AND LINT'S OWN FINDINGS, which are not compiler diagnostics and
      # would otherwise be invisible in the Checks tab. Without this the new job
      # would be strictly WORSE to read than the old one on the runs it exists
      # for: a lint error fails the job, and the tab would show nothing about
      # which file or which rule.
      - name: Publish lint findings as check annotations
        if: always()
        run: |
          set -uo pipefail
          chmod +x .github/scripts/annotate-lint.py
          python3 .github/scripts/annotate-lint.py

      - name: Write this job's summary
        if: always()
        env:
          LINT_OUTCOME: ${{ steps.lint_build.outcome }}
          # The postmortem section greps the Gradle log for `> Task … FAILED`
          # and `e: file://…`, so it has to be told WHICH log this runner wrote.
          # Without this a red lint run would show an empty "Failed tasks"
          # section — the one page a red run is read for — because the script
          # would be grepping the build runner's filename, which does not exist
          # here.
          GRADLE_LOG: gradle-lint.log
        run: |
          set -uo pipefail
          chmod +x .github/scripts/build-summary.sh
          # `signature` is "not applicable" rather than unknown: this runner has
          # no keystore and never had one, and build-summary.sh prints the Lint
          # count instead of the signing/APK rows for a non-build phase.
          .github/scripts/build-summary.sh "not applicable (lint runner)" "$LINT_OUTCOME" "${{ matrix.edition }}" "lint"

      - name: Fail the run when lint failed
        if: steps.lint_build.outcome == 'failure'
        run: |
          echo "::error::lint${{ matrix.cap }}Release failed — see the annotations above and the uploaded log."
          exit 1

      - name: Upload the lint log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: curio-lint-log-${{ matrix.edition }}-${{ github.run_number }}
          path: gradle-lint.log
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: curio-lint-reports-${{ matrix.edition }}-${{ github.run_number }}
          path: |
            app/build/reports/lint-results*.*
            app/build/reports/lint/**/*.html
            app/build/reports/lint/**/*.xml
          # Lint reports are best-effort diagnostics; the Gradle step above
          # remains authoritative for CI success/failure. Throwaway
          # diagnostics — shrink to the minimum so artifact storage barely
          # accumulates (matches the release-APK retention).
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload this job's report row
        id: report_row
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: curio-ci-report-${{ matrix.edition }}-lint
          path: ci-report/curio-${{ matrix.edition }}-lint.json
          if-no-files-found: warn
          retention-days: 1

  # ── SURFACE 3 + 4: THE REPORT JOB AND THE PULL REQUEST ─────────────────────
  #
  # A third job so the run's own list carries a "Curio CI report" entry: it
  # needs nothing from the machines that built or linted, only the rows they
  # published, which is why it is cheap. `if: always()` so a failed build still
  # produces the reader-facing summary.
  #
  # v465e — ONE COLUMN PER JOB, FROM ARTIFACTS. `build` and `lint` are both
  # matrices, so there is no single job whose outputs a report could quote (see
  # the note on those jobs' missing `outputs:` blocks, and on the steps below).
  #
  # v466 — FOUR COLUMNS: two editions × build|lint. Both needs are listed, and
  # the `if:` guards on `needs.build.result` alone, because that is the answer a
  # reader came for — a lint finding is interesting, a build that did not happen
  # is the whole story. `needs.lint.result` is still consulted by the rows
  # themselves: a cancelled lint job simply leaves its column as a named gap.
  report:
    name: Curio CI report
    needs: [build, lint]
    if: always() && needs.build.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write

    steps:
      # v465e — THIS JOB IS A READER OF ARTIFACTS NOW, NOT OF STEP OUTPUTS.
      #
      # `build` AND `lint` are both MATRICES (one parallel job per edition,
      # per phase), and `needs.<matrixed job>.outputs` is an aggregation whose
      # winner GitHub does not specify — a roll-up built on it would print ONE
      # job's numbers under a heading that implied all four, which is worse than
      # printing nothing when the questions this check answers are "did BOTH
      # editions build?" and "is either of them dirty?". So each job writes its
      # own row to `ci-report/` and uploads it, and `run-report.py` merges
      # whatever arrived. Do not reintroduce `needs.build.outputs.*` here.
      #
      # v466 — THE PATTERN NOW MATCHES FOUR ARTIFACTS, one per (edition, phase).
      # `merge-multiple` drops all four JSONs into one directory, which is safe
      # precisely because the FILE NAME carries both axes: a collision would
      # mean two jobs claiming the same (edition, phase), which cannot happen
      # without a matrix bug that this would then surface as one row silently
      # replacing another. The names are distinct by construction.
      #
      # Checkout is needed because the report is a script now, not inline shell
      # (it is called twice — once for the summary, once for the PR body — and a
      # heredoc duplicated at both call sites is two things to keep in step).
      - name: Check out Curio
        uses: actions/checkout@v5

      # `if: always()` and a TOLERANT reader: the report must still appear when
      # a job never got as far as uploading its row (it died before its summary
      # step). That absence IS the finding — run-report.py names the
      # (edition, phase) instead of leaving a column quietly empty.
      - name: Collect every job's row
        if: always()
        uses: actions/download-artifact@v6
        with:
          pattern: curio-ci-report-*
          path: ci-report
          merge-multiple: true

      - name: Publish the run report
        if: always()
        run: python3 .github/scripts/run-report.py

      # SURFACE 4 — the pull request. Same-repo PRs only: GitHub hands a fork
      # PR a read-only token, so this is skipped rather than failing. `gh pr
      # comment` upserts nothing, so the step deletes its own previous comment
      # first — matched by the `<!-- curio-ci-report -->` marker that
      # run-report.py writes as the FIRST LINE of its --pr-body output, which is
      # why the marker is no longer spelled out here (two copies of a marker
      # drift apart, and the one that drifts is the one nothing finds).
      - name: Comment the report on the pull request
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          marker="<!-- curio-ci-report -->"
          body=$(python3 .github/scripts/run-report.py --pr-body)
          existing=$(gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            --paginate -q ".[] | select(.body | startswith(\"$marker\")) | .id" | head -1)
          if [ -n "$existing" ]; then
            gh api -X DELETE "repos/${{ github.repository }}/issues/comments/$existing" > /dev/null
          fi
          printf '%s' "$body" | gh pr comment "${{ github.event.pull_request.number }}" --body-file -

  # v27t — Compose Multiplatform desktop port. DISABLED (if: false) until
  # the desktop app is finished — the port isn't ready, so stop burning CI
  # minutes building it on every push/PR and on tag pushes
  # (desktop-release.yml is gated the same way). To re-enable: flip this
  # `if: false` to `if: true` (and restore the desktop-release.yml gate).
  # When active: keep the JVM/desktop module compiling on every push AND
  # every PR so the port can't silently rot; the compiled JAR is uploaded
  # only on branch pushes (main/Alpha), never on PR runs — a 4MB jar per
  # PR commit was piling up in artifact storage. Native .exe/.dmg/.deb
  # packaging happens in a dedicated desktop release workflow (tag pushes).
  desktop:
    name: Compile Curio Desktop (JVM)
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out Curio
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Compile and build the desktop module
        run: ./gradlew :desktop:build --stacktrace

      # The JAR here is a plain compile artifact (classes + topic resources),
      # NOT a standalone-runnable app — a runnable desktop build needs the
      # Compose runtime + Skiko native libs, which the desktop release
      # workflow bundles via jpackage on a tag push.
      # Branch pushes only (never PR runs): PR CI is throwaway and a 4MB jar
      # per commit was accumulating in artifact storage. Retention shrunk to
      # the 1-day minimum to match the release-APK policy.
      - name: Upload desktop JAR
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v6
        with:
          name: curio-desktop-jar-${{ github.run_number }}
          path: desktop/build/libs/*.jar
          if-no-files-found: error
          retention-days: 1

  # Cache hygiene — gradle/actions/setup-gradle keys the Gradle User Home
  # cache with the commit SHA, so every push writes fresh cache entries and
  # the old ones linger until GitHub's 7-day no-access eviction. That piled
  # up to 150+ entries / 4GB+. Prune entries not accessed in the last 2 days
  # on every branch push so cache storage stays flat. PR runs skip this
  # (fork PRs can't write actions caches anyway, and PR-branch entries are
  # short-lived).
  cache-cleanup:
    name: Prune stale Gradle caches
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      actions: write

    steps:
      - name: Delete caches not accessed in 2 days
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cutoff=$(date -u -d '2 days ago' +%Y-%m-%dT%H:%M:%SZ)
          deleted=0
          for id in $(gh api "repos/${{ github.repository }}/actions/caches" --paginate \
            -q ".actions_caches[] | select(.last_accessed_at < \"$cutoff\") | .id"); do
            gh api -X DELETE "repos/${{ github.repository }}/actions/caches/$id" > /dev/null
            deleted=$((deleted+1))
          done
          echo "Deleted $deleted stale cache entrie(s) not accessed since $cutoff"
