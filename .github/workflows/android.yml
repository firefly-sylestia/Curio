name: Curio Android CI

on:
  push:
    branches: [main, Alpha]
  pull_request:
    branches: [main, Alpha]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: curio-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ─────────────────────────────────────────────────────────────────────────────
# THE RUN HAS FOUR SURFACES (v405)
#
# The run page used to be one long job whose only output was a wall of Gradle
# log. It now answers four questions in four places, because each of them is
# read by a different person at a different moment:
#
#   1. THE SUMMARY (this page, bottom) — "what did this build actually do?" A
#      table of the verdict, the version, the catalogs bundled, the
#      warning/error counts, the signing story and the APK's size and SHA-256
#      — and, when the build FAILED, the failed Gradle tasks and the first
#      compiler errors lifted out of the log (v412). Written by
#      `.github/scripts/build-summary.sh`, rendered by GitHub from
#      `$GITHUB_STEP_SUMMARY`.
#   2. THE CHECKS TAB — the Kotlin compiler's own `e:`/`w:` lines re-emitted as
#      ANNOTATIONS (`::error`/`::warning` with a file, line and column), so a
#      warning is a clickable row on the changed file instead of a line in a
#      12,000-line log. Written by `.github/scripts/annotate-gradle.sh`.
#   3. THE REPORT JOB — one check whose whole body is the summary, so the run's
#      list reads "Curio Android CI / Curio CI report" next to the build, and a
#      reviewer who opens only the report still sees everything.
#   4. THE PULL REQUEST — the same summary as an upserted comment, for a
#      same-repo PR only (a fork PR's token is read-only, so it is skipped).
# ─────────────────────────────────────────────────────────────────────────────

jobs:
  verify:
    name: Curio Android · ${{ matrix.edition }} (validate · lint · release)
    runs-on: ubuntu-latest
    # ── v465e — ONE EDITION PER RUNNER, STARTING TOGETHER ────────────────────
    #
    # The member: *"start the workflow build of the two version in a separate …
    # make it start simultaneously"*. One job built both editions in a single
    # Gradle invocation, which is why a run took ~30 minutes; a matrix puts one
    # edition on each runner so they compile at the same time and wall-clock
    # roughly halves, at the cost of the fixed per-job overhead (checkout, JDK,
    # SDK, catalog bundling) being paid twice.
    #
    # `fail-fast: false` ON PURPOSE: this job's whole job is proving that BOTH
    # editions still build, and fail-fast would cancel `full` the moment `core`
    # broke — which is the one run where the second answer is most wanted.
    #
    # ⚠️ NO JOB-LEVEL `outputs:` HERE, AND THAT IS THE POINT. This used to
    # publish eleven step outputs for the standalone report job to quote. A
    # MATRIX JOB CANNOT OFFER A SINGLE JOB'S OUTPUTS — `needs.verify.outputs`
    # becomes an aggregation whose winner GitHub does not specify, so a roll-up
    # built on it would print one edition's numbers under a heading implying
    # both. Each edition therefore WRITES its row to `ci-report/` and uploads it
    # (see build-summary.sh and run-report.py); the report merges artifacts.
    # Do not reintroduce `needs.verify.outputs.*` in the report job.
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: core
            # The Gradle task's own capitalisation: `assembleCoreRelease`.
            cap: Core
          - edition: full
            cap: Full
    # v465c — 60 minutes, not 45: the FULL edition now links a vendored 48 MB
    # native AAR (sherpa-onnx) and R8 has to process it whole, on top of the two
    # editions' compile and lint. The 45-minute ceiling was set when the only
    # extra weight was Vosk; a timeout that binds on the build that is supposed
    # to take longest is a timeout that fails a healthy run, which is worse than
    # a generous one.
    #
    # v465 — 45 minutes, not 30: TWO editions are compiled and linted now (core
    # + full). Each edition is named explicitly (`lintCoreRelease` /
    # `assembleCoreRelease` and their `full` twins) — the bare `lintRelease` /
    # `assembleRelease` names are ambiguous under the flavor dimension and fail
    # at task selection, so CI is the thing that proves BOTH editions build.
    timeout-minutes: 60

    steps:
      - name: Check out Curio
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Decode release keystore when signing secrets are available
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Release signing secrets not available (fork PR or unconfigured repo) — release APK will use the debug-signing fallback."
            echo "decoded=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > release.keystore
          size=$(wc -c < release.keystore)
          if [ "$size" -lt 100 ]; then
            echo "::error::Decoded release keystore is unexpectedly small (${size} bytes)."
            exit 1
          fi
          echo "Release keystore decoded (${size} bytes)."
          echo "decoded=true" >> "$GITHUB_OUTPUT"

      # Bundle the source catalogs as Android assets. The app imports these JSON
      # files into its user database on first launch (and retries for existing
      # installs whose previous import produced zero rows). The per-file record
      # goes into the summary — an empty or truncated catalog is the one failure
      # this step exists to catch, and it is invisible in a log line count.
      - name: Bundle the topic catalogs
        id: topics
        run: |
          set -euo pipefail
          rm -rf app/src/main/assets/topics
          mkdir -p app/src/main/assets/topics
          cp data/topics/*.json app/src/main/assets/topics/
          catalogs=$(find app/src/main/assets/topics -maxdepth 1 -name '*.json' | wc -l)
          if [ "$catalogs" -eq 0 ]; then
            echo "::error::No topic JSON assets were bundled."
            exit 1
          fi
          topics=$(python3 - <<'PY'
          import glob, json
          total = 0
          for path in glob.glob("app/src/main/assets/topics/*.json"):
              with open(path, encoding="utf-8") as handle:
                  data = json.load(handle)
              total += len(data if isinstance(data, list) else data.get("topics", []))
          print(total)
          PY
          )
          echo "catalogs=${catalogs}" >> "$GITHUB_OUTPUT"
          echo "topics=${topics}" >> "$GITHUB_OUTPUT"
          echo "Bundled ${catalogs} catalog files carrying ${topics} topics."

      # PR/push CI builds ONE universal release APK (curioAbiSplits=false
      # disables the per-ABI split packaging in app/build.gradle.kts).
      # The tag release workflow builds the full universal + per-ABI set.
      #
      # v412 — the job compiles ONE variant, not two: `assembleRelease` was
      # the build, and lint ran `lintRelease` so it REUSED the release
      # compilation `assembleRelease` just did instead of compiling the
      # debug variant a second time (~half the Kotlin work per run).
      #
      # v465b — with the `edition` flavor dimension, `lintRelease` and
      # `assembleRelease` are AMBIGUOUS: Gradle refuses to pick between
      # `lintCoreRelease` and `lintFullRelease` and fails at TASK SELECTION,
      # before a single line compiles ("Task 'lintRelease' is ambiguous in
      # root project 'Curio' and its subprojects"). Every task below is
      # therefore spelled out per edition. The pairing is kept — each
      # `lint<Flavor>Release` runs first, so the `assemble<Flavor>Release`
      # beside it reuses that variant's compilation rather than redoing it.
      #
      # `continue-on-error` so the annotation and summary steps below still run
      # on a FAILED build — the compiler's own errors are exactly what the
      # Checks tab should be showing — and the outcome is re-failed by the gate
      # step after them.
      - name: Validate, lint and build the release APK
        id: build
        continue-on-error: true
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          # v354 — optional: free Google Books API key. When the secret is
          # present it is baked into BuildConfig.GOOGLE_BOOKS_API_KEY and the
          # book fetchers append &key= for the higher quota; unset stays keyless.
          GOOGLE_BOOKS_API_KEY: ${{ secrets.GOOGLE_BOOKS_API_KEY }}
          # v356 — optional: free LibraryThing developer key. When present it
          # is baked into BuildConfig.LIBRARY_THING_API_KEY and the hub shows
          # the LibraryThing cover source; unset hides it (keyless providers
          # keep working).
          LIBRARY_THING_API_KEY: ${{ secrets.LIBRARY_THING_API_KEY }}
          # v358 — optional: Spotify developer credentials. When present they
          # are baked into BuildConfig and music topics deep-link to real
          # open.spotify.com items (client-credentials flow); unset keeps the
          # search links.
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          # v389f — optional: free TMDB API key. When present it is baked into
          # BuildConfig.TMDB_API_KEY and the film / anime sheets resolve their
          # artwork (and a film's facts, and the episodes of a title that is
          # really a show) from TMDB first; unset stays on the keyless
          # providers (iTunes, TVMaze, Jikan).
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          # v428 — optional: TMDB's OTHER credential, the "API Read Access
          # Token" (a JWT, sent as `Authorization: Bearer …` and valid on v3 and
          # v4 alike). Either secret on its own is enough — the token is read
          # first, and a JWT in the key field is recognised as one.
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
          # v426 — optional: free Comic Vine key (non-commercial use). When
          # present it is baked into BuildConfig.COMIC_VINE_API_KEY and the
          # comics sources ask it FIRST for a Comic and LAST for a manga, so a
          # Western comic resolves its own cover, publisher, year and issue
          # count; unset stays on the keyless comics sources.
          COMIC_VINE_API_KEY: ${{ secrets.COMIC_VINE_API_KEY }}
          # v428b — optional: free OMDb key (1,000 requests/day). When present it
          # is baked into BuildConfig.OMDB_API_KEY and a film or a series that
          # TMDB could not answer for gets its plot, poster, rating and runtime
          # from OMDb before the keyless doors are tried; unset changes nothing.
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
          # Supabase (account sign-in + Online Mode backend). The project URL
          # and the publishable/anon key are PUBLIC client credentials and are
          # baked into BuildConfig; the service-role key must NEVER be added
          # here or anywhere else in this workflow. Unset leaves
          # SupabaseClient.isConfigured false, so Online Mode reports
          # unconfigured instead of crashing.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          # Either secret name is accepted — app/build.gradle.kts reads
          # SUPABASE_PUBLISHABLE_KEY first and falls back to SUPABASE_ANON_KEY,
          # so the build works whichever name the repository uses.
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          # The Curio account site (auth-web/), where confirmation and password
          # reset emails send people. Optional: unset (empty) leaves Supabase's
          # own Site URL in charge and hides the app's password-recovery row.
          CURIO_AUTH_SITE_URL: ${{ secrets.CURIO_AUTH_SITE_URL }}
        run: |
          set -o pipefail
          if [ -z "$SUPABASE_URL" ] || { [ -z "$SUPABASE_PUBLISHABLE_KEY" ] && [ -z "$SUPABASE_ANON_KEY" ]; }; then
            echo "::warning::Supabase URL/key secrets not provided — this build's Online Mode will report unconfigured."
          else
            echo "Supabase project URL + publishable key were provided to the build."
          fi
          # v465e — ONE EDITION's tasks, from the matrix. `${{ matrix.cap }}` is
          # `Core`/`Full` to match Gradle's own task capitalisation, and the two
          # names are paired on purpose: `lint<Cap>Release` runs first so the
          # `assemble<Cap>Release` beside it reuses that variant's compilation
          # instead of redoing it (the v412 optimisation, kept per edition).
          ./gradlew lint${{ matrix.cap }}Release validateTopics assemble${{ matrix.cap }}Release -PcurioAbiSplits=false --stacktrace 2>&1 \
            | tee gradle-build.log

      # ── SURFACE 2: THE CHECKS TAB ──────────────────────────────────────────
      # Every Kotlin diagnostic in the log becomes a real annotation, and the
      # counts become outputs the summary and the report job reuse. Nothing here
      # can fail the run: it is a reader of the log, not a check.
      - name: Publish compiler diagnostics as check annotations
        id: annotate
        if: always()
        run: |
          set -uo pipefail
          chmod +x .github/scripts/annotate-gradle.sh .github/scripts/build-summary.sh
          .github/scripts/annotate-gradle.sh gradle-build.log

      # ── SURFACE 1: THE SUMMARY ─────────────────────────────────────────────
      - name: Verify release APKs and signatures
        id: apk
        if: steps.build.outcome == 'success' && steps.keystore.outputs.decoded == 'true'
        run: |
          set -euo pipefail
          shopt -s nullglob
          # v465 — one directory per edition: the `edition` flavor dimension
          # moved the outputs from `apk/release/` to `apk/<flavor>/release/`, so
          # the extra level is part of the glob now.
          #
          # v465e — NARROWED TO THIS RUNNER'S EDITION. The wildcard would still
          # find the right directory (one edition builds here), but naming it
          # means a mis-set matrix axis fails as "no APK" instead of silently
          # checking the OTHER edition's output and passing.
          apks=(app/build/outputs/apk/${{ matrix.edition }}/release/*.apk)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "::error::No signed release APK was produced."
            exit 1
          fi
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          apksigner=$(find "$sdk_root/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          if [ -z "$apksigner" ]; then
            echo "::error::Android build-tools apksigner was not found."
            exit 1
          fi
          for apk in "${apks[@]}"; do
            echo "Release APK: $apk"
            "$apksigner" verify --print-certs "$apk"
            if "$apksigner" verify --print-certs "$apk" 2>&1 | grep -q 'CN=Android Debug'; then
              echo "::error::Release APK $apk is signed with the Android debug key."
              exit 1
            fi
          done
          # v465 — every APK found is NAMED, not just the first, because a
          # release build emits a universal APK AND one per ABI.
          #
          # v465e — this runner holds ONE edition, so there is no longer a
          # question of which edition a size refers to; the count is the ABI set.
          apk="${apks[0]}"
          names=""
          for one in "${apks[@]}"; do
            if [ -n "$names" ]; then names="$names, "; fi
            names="$names$(basename "$one")"
          done
          echo "name=${names}" >> "$GITHUB_OUTPUT"
          echo "size=$(du -h "$apk" | cut -f1) (first of ${#apks[@]})" >> "$GITHUB_OUTPUT"
          echo "sha=$(sha256sum "$apk" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "signature=release keystore" >> "$GITHUB_OUTPUT"
          echo "Verified ${#apks[@]} release APK(s) — none signed with the debug key."

      - name: Read the lint totals
        id: lint
        if: always()
        run: |
          set -uo pipefail
          # v412 — lint runs the RELEASE variant now (see the build step), so
          # the report name moved with it; keep the old glob as a fallback.
          report=$(ls app/build/reports/lint-results*.txt 2>/dev/null | head -1 || true)
          if [ -z "$report" ]; then
            echo "errors=0" >> "$GITHUB_OUTPUT"
            echo "warnings=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          totals=$(grep -oE '[0-9]+ (errors?|warnings?)' "$report" | tail -2 | tr '\n' ' ' || true)
          errors=$(printf '%s' "$totals" | grep -oE '[0-9]+ error' | grep -oE '[0-9]+' | head -1)
          warnings=$(printf '%s' "$totals" | grep -oE '[0-9]+ warning' | grep -oE '[0-9]+' | head -1)
          echo "errors=${errors:-0}" >> "$GITHUB_OUTPUT"
          echo "warnings=${warnings:-0}" >> "$GITHUB_OUTPUT"

      - name: Write the run summary
        id: summary
        if: always()
        env:
          DECODED: ${{ steps.keystore.outputs.decoded }}
          APK_SIGNATURE: ${{ steps.apk.outputs.signature }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          set -uo pipefail
          version_code=$(grep -oE 'versionCode[[:space:]]*=[[:space:]]*[0-9]+' app/build.gradle.kts | grep -oE '[0-9]+' | head -1)
          version_name=$(grep -oE 'envReleaseVersion \?: "[0-9.]+"' app/build.gradle.kts | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          if [ -n "$APK_SIGNATURE" ]; then
            signature="$APK_SIGNATURE"
          elif [ "$DECODED" == "true" ]; then
            signature="release keystore (no APK to verify)"
          else
            signature="debug-key fallback (no keystore secrets)"
          fi
          # v412 — the outcome rides along so the summary can open with the
          # verdict and, on a failure, carry the failed tasks and the first
          # compiler errors (see build-summary.sh's postmortem block).
          #
          # v465e — and the EDITION, which is what tells the script to read this
          # runner's APK directory rather than every edition's, and what makes it
          # write `ci-report/curio-<edition>.json` for the report job.
          chmod +x .github/scripts/run-report.py
          .github/scripts/build-summary.sh "$signature" "$BUILD_OUTCOME" "${{ matrix.edition }}"
          echo "version=${version_name:-1.1.1} (${version_code:-20260922})" >> "$GITHUB_OUTPUT"
          echo "signature=${signature}" >> "$GITHUB_OUTPUT"

      - name: Fail the run when the build failed
        if: steps.build.outcome == 'failure'
        run: |
          echo "::error::The Gradle build failed — see the annotations above and the uploaded log."
          exit 1

      - name: Upload the Gradle log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: curio-gradle-log-${{ matrix.edition }}-${{ github.run_number }}
          path: gradle-build.log
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: curio-lint-reports-${{ matrix.edition }}-${{ github.run_number }}
          path: |
            app/build/reports/lint-results*.*
            app/build/reports/lint/**/*.html
            app/build/reports/lint/**/*.xml
          # Lint reports are best-effort diagnostics; the Gradle step above
          # remains authoritative for CI success/failure. Throwaway
          # diagnostics — shrink to the minimum so artifact storage barely
          # accumulates (matches the release-APK retention below).
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload release APKs
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: curio-pr-release-apks-${{ matrix.edition }}-${{ github.run_number }}
          # v465 — one directory per edition (apk/<flavor>/release/).
          # v465e — this runner's directory only, so the two editions' artifacts
          # never collide on one name and stay tellable apart in the run.
          path: app/build/outputs/apk/${{ matrix.edition }}/release/*.apk
          if-no-files-found: error
          # v26 — CI PR/push APKs are throwaway test builds: shrink to the
          # minimum so artifact storage barely accumulates. The official
          # APKs attached to tag RELEASES (release.yml) stay permanent.
          retention-days: 1

      # ── v465e — THIS EDITION'S ROW, FOR THE REPORT JOB ──────────────────
      # Written by build-summary.sh above, even on a failed build, because
      # "which edition broke" is the first question a red run has to answer.
      # `if: always()` so the row exists whatever happened before it.
      - name: Upload this edition's report row
        id: report_row
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: curio-ci-report-${{ matrix.edition }}
          path: ci-report/curio-${{ matrix.edition }}.json
          if-no-files-found: warn
          retention-days: 1

      - name: Note the signing fallback
        if: steps.keystore.outputs.decoded != 'true'
        run: |
          {
            echo ""
            echo "> Signing: **debug-key fallback** — no \`KEYSTORE_*\` secrets reached this run"
            echo "> (a fork PR, or an unconfigured repository). A published release never falls back."
          } >> "$GITHUB_STEP_SUMMARY"

  # ── SURFACE 3 + 4: THE REPORT JOB AND THE PULL REQUEST ─────────────────────
  #
  # A second job so the run's own list carries a "Curio CI report" entry: it
  # needs nothing from the machines that built the APKs, only the rows they
  # published, which is why it is cheap. `if: always()` so a failed build still
  # produces the reader-facing summary.
  #
  # v465e — ONE COLUMN PER EDITION, FROM ARTIFACTS. `verify` is now a matrix, so
  # there is no single job whose outputs a report could quote (see the note on
  # that job's missing `outputs:` block, and on the steps below).
  report:
    name: Curio CI report
    needs: verify
    if: always() && needs.verify.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write

    steps:
      # v465e — THIS JOB IS A READER OF ARTIFACTS NOW, NOT OF STEP OUTPUTS.
      #
      # `verify` is a MATRIX (one parallel job per edition), and
      # `needs.<matrixed job>.outputs` is an aggregation whose winner GitHub
      # does not specify — a roll-up built on it would print ONE edition's
      # numbers under a heading that implied both, which is worse than printing
      # nothing when the only question this check answers is "did BOTH editions
      # build?". So each edition writes its own row to `ci-report/` and uploads
      # it, and `run-report.py` merges whatever arrived. Do not reintroduce
      # `needs.verify.outputs.*` here.
      #
      # Checkout is needed because the report is a script now, not inline shell
      # (it is called twice — once for the summary, once for the PR body — and a
      # heredoc duplicated at both call sites is two things to keep in step).
      - name: Check out Curio
        uses: actions/checkout@v5

      # `if: always()` and a TOLERANT reader: the report must still appear when
      # one edition's job never got as far as uploading its row (it died before
      # its summary step). That absence IS the finding — run-report.py names the
      # edition instead of leaving a column quietly empty.
      - name: Collect each edition's row
        if: always()
        uses: actions/download-artifact@v6
        with:
          pattern: curio-ci-report-*
          path: ci-report
          merge-multiple: true

      - name: Publish the run report
        if: always()
        run: python3 .github/scripts/run-report.py

      # SURFACE 4 — the pull request. Same-repo PRs only: GitHub hands a fork
      # PR a read-only token, so this is skipped rather than failing. `gh pr
      # comment` upserts nothing, so the step deletes its own previous comment
      # first — matched by the `<!-- curio-ci-report -->` marker that
      # run-report.py writes as the FIRST LINE of its --pr-body output, which is
      # why the marker is no longer spelled out here (two copies of a marker
      # drift apart, and the one that drifts is the one nothing finds).
      - name: Comment the report on the pull request
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          marker="<!-- curio-ci-report -->"
          body=$(python3 .github/scripts/run-report.py --pr-body)
          existing=$(gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            --paginate -q ".[] | select(.body | startswith(\"$marker\")) | .id" | head -1)
          if [ -n "$existing" ]; then
            gh api -X DELETE "repos/${{ github.repository }}/issues/comments/$existing" > /dev/null
          fi
          printf '%s' "$body" | gh pr comment "${{ github.event.pull_request.number }}" --body-file -

  # v27t — Compose Multiplatform desktop port. DISABLED (if: false) until
  # the desktop app is finished — the port isn't ready, so stop burning CI
  # minutes building it on every push/PR and on tag pushes
  # (desktop-release.yml is gated the same way). To re-enable: flip this
  # `if: false` to `if: true` (and restore the desktop-release.yml gate).
  # When active: keep the JVM/desktop module compiling on every push AND
  # every PR so the port can't silently rot; the compiled JAR is uploaded
  # only on branch pushes (main/Alpha), never on PR runs — a 4MB jar per
  # PR commit was piling up in artifact storage. Native .exe/.dmg/.deb
  # packaging happens in a dedicated desktop release workflow (tag pushes).
  desktop:
    name: Compile Curio Desktop (JVM)
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out Curio
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Compile and build the desktop module
        run: ./gradlew :desktop:build --stacktrace

      # The JAR here is a plain compile artifact (classes + topic resources),
      # NOT a standalone-runnable app — a runnable desktop build needs the
      # Compose runtime + Skiko native libs, which the desktop release
      # workflow bundles via jpackage on a tag push.
      # Branch pushes only (never PR runs): PR CI is throwaway and a 4MB jar
      # per commit was accumulating in artifact storage. Retention shrunk to
      # the 1-day minimum to match the release-APK policy.
      - name: Upload desktop JAR
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v6
        with:
          name: curio-desktop-jar-${{ github.run_number }}
          path: desktop/build/libs/*.jar
          if-no-files-found: error
          retention-days: 1

  # Cache hygiene — gradle/actions/setup-gradle keys the Gradle User Home
  # cache with the commit SHA, so every push writes fresh cache entries and
  # the old ones linger until GitHub's 7-day no-access eviction. That piled
  # up to 150+ entries / 4GB+. Prune entries not accessed in the last 2 days
  # on every branch push so cache storage stays flat. PR runs skip this
  # (fork PRs can't write actions caches anyway, and PR-branch entries are
  # short-lived).
  cache-cleanup:
    name: Prune stale Gradle caches
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      actions: write

    steps:
      - name: Delete caches not accessed in 2 days
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cutoff=$(date -u -d '2 days ago' +%Y-%m-%dT%H:%M:%SZ)
          deleted=0
          for id in $(gh api "repos/${{ github.repository }}/actions/caches" --paginate \
            -q ".actions_caches[] | select(.last_accessed_at < \"$cutoff\") | .id"); do
            gh api -X DELETE "repos/${{ github.repository }}/actions/caches/$id" > /dev/null
            deleted=$((deleted+1))
          done
          echo "Deleted $deleted stale cache entrie(s) not accessed since $cutoff"
