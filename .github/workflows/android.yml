name: Curio Android CI

on:
  push:
    branches: [main, Alpha]
  pull_request:
    branches: [main, Alpha]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: curio-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Validate, lint, and build release APKs
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out Curio
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Decode release keystore when signing secrets are available
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Release signing secrets not available (fork PR or unconfigured repo) — release APK will use the debug-signing fallback."
            echo "decoded=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > release.keystore
          size=$(wc -c < release.keystore)
          if [ "$size" -lt 100 ]; then
            echo "::error::Decoded release keystore is unexpectedly small (${size} bytes)."
            exit 1
          fi
          echo "Release keystore decoded (${size} bytes)."
          echo "decoded=true" >> "$GITHUB_OUTPUT"

      # PR/push CI builds ONE universal release APK (curioAbiSplits=false
      # disables the per-ABI split packaging in app/build.gradle.kts). The
      # tag release workflow builds the full universal + per-ABI set.
      - name: Run Android checks and build the universal release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew lintDebug validateTopics assembleRelease -PcurioAbiSplits=false --stacktrace

      - name: Verify release APKs and signatures
        if: steps.keystore.outputs.decoded == 'true'
        run: |
          set -euo pipefail
          # PR/push CI: exactly one universal release APK (splits disabled
          # via -PcurioAbiSplits=false — see app/build.gradle.kts).
          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*.apk)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "::error::No signed release APK was produced."
            exit 1
          fi
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          apksigner=$(find "$sdk_root/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          if [ -z "$apksigner" ]; then
            echo "::error::Android build-tools apksigner was not found."
            exit 1
          fi
          for apk in "${apks[@]}"; do
            echo "Release APK: $apk"
            "$apksigner" verify --print-certs "$apk"
            if "$apksigner" verify --print-certs "$apk" 2>&1 | grep -q 'CN=Android Debug'; then
              echo "::error::Release APK $apk is signed with the Android debug key."
              exit 1
            fi
          done
          echo "Verified ${#apks[@]} release APK(s) — none signed with the debug key."

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: curio-lint-reports-${{ github.run_number }}
          path: |
            app/build/reports/lint-results*.*
            app/build/reports/lint/**/*.html
            app/build/reports/lint/**/*.xml
          # Lint reports are best-effort diagnostics; the Gradle step above
          # remains authoritative for CI success/failure.
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload release APKs
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: curio-pr-release-apks-${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          # v26 — CI PR/push APKs are throwaway test builds: shrink to the
          # minimum so artifact storage barely accumulates. The official
          # APKs attached to tag RELEASES (release.yml) stay permanent.
          retention-days: 1

  # v27t — Compose Multiplatform desktop port: keep the JVM/desktop module
  # compiling on every push so the port can't silently rot, and upload the
  # compiled JAR as a downloadable artifact. Native .exe/.dmg/.deb packaging
  # happens in a dedicated desktop release workflow (tag pushes).
  desktop:
    name: Compile Curio Desktop (JVM)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out Curio
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Compile and build the desktop module
        run: ./gradlew :desktop:build --stacktrace

      # The JAR here is a plain compile artifact (classes + topic resources),
      # NOT a standalone-runnable app — a runnable desktop build needs the
      # Compose runtime + Skiko native libs, which the desktop release
      # workflow bundles via jpackage on a tag push.
      - name: Upload desktop JAR
        uses: actions/upload-artifact@v6
        with:
          name: curio-desktop-jar-${{ github.run_number }}
          path: desktop/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
