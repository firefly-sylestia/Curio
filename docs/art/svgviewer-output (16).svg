<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1400 1400"
     width="1400"
     height="1400">

<defs>

  <radialGradient id="space" cx="50%" cy="50%" r="78%">
    <stop offset="0%" stop-color="#101d45"/>
    <stop offset="38%" stop-color="#08132f"/>
    <stop offset="72%" stop-color="#03091d"/>
    <stop offset="100%" stop-color="#01030b"/>
  </radialGradient>

  <radialGradient id="purpleNebula">
    <stop offset="0%" stop-color="#8d45bd" stop-opacity=".15"/>
    <stop offset="45%" stop-color="#55277f" stop-opacity=".06"/>
    <stop offset="100%" stop-color="#18072d" stop-opacity="0"/>
  </radialGradient>

  <radialGradient id="blueNebula">
    <stop offset="0%" stop-color="#3979c9" stop-opacity=".13"/>
    <stop offset="45%" stop-color="#24518c" stop-opacity=".055"/>
    <stop offset="100%" stop-color="#061128" stop-opacity="0"/>
  </radialGradient>

  <pattern id="backgroundStars"
           width="180"
           height="180"
           patternUnits="userSpaceOnUse">

    <circle cx="18" cy="22" r=".8"
            fill="#fff" opacity=".60"/>
    <circle cx="61" cy="70" r=".55"
            fill="#c9e2ff" opacity=".65"/>
    <circle cx="128" cy="29" r=".75"
            fill="#fff" opacity=".55"/>
    <circle cx="157" cy="91" r=".55"
            fill="#fff" opacity=".60"/>
    <circle cx="39" cy="130" r=".55"
            fill="#9fc8ed" opacity=".55"/>
    <circle cx="101" cy="151" r=".7"
            fill="#fff" opacity=".55"/>
    <circle cx="151" cy="164" r=".45"
            fill="#fff" opacity=".65"/>
    <circle cx="87" cy="103" r=".45"
            fill="#fff" opacity=".55"/>
    <circle cx="12" cy="166" r=".45"
            fill="#8db9e5" opacity=".55"/>

  </pattern>

</defs>


<!-- =========================================================
     BACKGROUND
     ========================================================= -->

<rect width="1400"
      height="1400"
      fill="url(#space)"/>

<ellipse cx="220"
         cy="400"
         rx="390"
         ry="500"
         fill="url(#purpleNebula)"
         transform="rotate(-25 220 400)"/>

<ellipse cx="1160"
         cy="850"
         rx="430"
         ry="520"
         fill="url(#blueNebula)"
         transform="rotate(20 1160 850)"/>

<ellipse cx="700"
         cy="1170"
         rx="470"
         ry="280"
         fill="url(#purpleNebula)"/>

<rect width="1400"
      height="1400"
      fill="url(#backgroundStars)"/>


<!-- =========================================================
     MAIN CONSTELLATION
     
     Zoomed approximately 1.55x around center.
     
