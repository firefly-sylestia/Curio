<svg xmlns="http://www.w3.org/2000/svg" width="150" height="420" viewBox="0 0 150 420" version="1.1" xmlns:xlink="http://www.w3.org/1999/xlink" transform="matrix(-1,0,0,1,0,0)">

  <defs>
    <!-- 3D metallic tube -->
    <linearGradient id="metal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1c2937"></stop>
      <stop offset="12%" stop-color="#52687d"></stop>
      <stop offset="28%" stop-color="#dce9f6"></stop>
      <stop offset="42%" stop-color="#8196aa"></stop>
      <stop offset="55%" stop-color="#ffffff"></stop>
      <stop offset="70%" stop-color="#9caec0"></stop>
      <stop offset="88%" stop-color="#43586c"></stop>
      <stop offset="100%" stop-color="#172432"></stop>
    </linearGradient>

    <linearGradient id="darkMetal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0e1822"></stop>
      <stop offset="50%" stop-color="#53687c"></stop>
      <stop offset="100%" stop-color="#101b26"></stop>
    </linearGradient>
  </defs>


