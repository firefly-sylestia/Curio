# F-Droid build metadata for Curio — DRAFT for the fdroiddata inclusion MR
#
# This file does NOT belong in this repository's build. Copy it to:
#
#   https://gitlab.com/fdroid/fdroiddata  →  metadata/com.curio.app.yml
#
# The step-by-step for the inclusion merge request lives in fdroid/README.md.
# Lines marked ⚠️ are things to fill or verify before opening the MR.
#
# IMPORTANT — how F-Droid builds Curio: their builder runs the CORE FLAVOR
# (`gradle: core` → `assembleCoreRelease`). It does NOT use this repo's
# `fdroid` build type — that type only exists for this repo's own comparable
# release artifact. The core flavor is fully FOSS by construction: every
# non-free dependency (ML Kit barcode model, sherpa-onnx AAR, CameraX) is
# `fullImplementation` and never enters a core APK.

Categories:
  - Reading
  - Science & Education
License: AGPL-3.0
AuthorName: Firefly
# ⚠️ TODO — add the author email / site if you want them shown on the listing:
# AuthorEmail: …
WebSite: https://github.com/firefly-sylestia/Curio
SourceCode: https://github.com/firefly-sylestia/Curio
IssueTracker: https://github.com/firefly-sylestia/Curio/issues
Changelog: https://github.com/firefly-sylestia/Curio/releases

RepoType: git
Repo: https://github.com/firefly-sylestia/Curio

Builds:
  # ── First F-Droid build: v1.4.0 ─────────────────────────────────────────
  # Chosen deliberately: at this tag the app was a SINGLE-FLAVOR build with
  # no ML Kit, no vendored sherpa-onnx AAR and no flavor dimension — a clean
  # FOSS tree with no blobs for the scanner to flag. Vosk (the only speech
  # lib then) is Apache-2.0. versionCode 20260923 / versionName 1.4.0 are
  # read from that tag's app/build.gradle.kts.
  - versionName: 1.4.0
    versionCode: 20260923
    commit: v1.4.0
    subdir: app
    gradle:
      - yes
    # The topic catalog ships as data/topics/*.json at the repo root; the
    # app's own CI copies it into assets before building (a clean checkout's
    # assets/topics/ holds only SCHEMA.md). F-Droid's builder must do the
    # same or the app installs with an EMPTY topic catalog.
    prebuild: mkdir -p src/main/assets/topics && cp ../data/topics/*.json src/main/assets/topics/

  # ── Template for every future version (auto-update picks this shape) ────
  # v1.4.6 is the current version; the tag v1.4.6 must EXIST before this
  # block is committed to fdroiddata (⚠️ push the tag first, or leave this
  # block out and let AutoUpdateMode add it automatically).
  # From v1.4.1 on the app has the `edition` flavor dimension — build the
  # CORE flavor only. The full edition's non-free pieces never enter this
  # APK by construction. The vendored AAR sits in the tree but is not part
  # of a core build; scandelete keeps the blob scanner from flagging it.
  - versionName: 1.4.6
    versionCode: 20260929
    commit: v1.4.6
    subdir: app
    gradle:
      - core
    prebuild: mkdir -p src/main/assets/topics && cp ../data/topics/*.json src/main/assets/topics/
    scandelete:
      - libs/sherpa-onnx-1.13.8.aar

# Auto-update: when a new v<version> tag lands, fdroidserver opens an MR
# adding a build block from the newest `core` shape above. versionCode is
# date-based and strictly increasing, which is all F-Droid needs.
AutoUpdateMode: Version v%v
UpdateCheckMode: Tags
# The repo carries a stray `v2.1-beta6` tag (2026-09-14, likely a typo of
# v1.2.0-beta6) that sorts ABOVE v1.4.x — without this ignore the update
# check would latch onto it. Prereleases are excluded from the store anyway.
# ⚠️ Better long-term fix: delete or re-tag v2.1-beta6 upstream.
UpdateCheckIgnore: (alpha|beta|rc)
CurrentVersion: 1.4.6
CurrentVersionCode: 20260929
