<svg xmlns="http://www.w3.org/2000/svg" width="320" height="186" viewBox="0 0 320 186">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#72C7DF"/>
      <stop offset=".48" stop-color="#A9DDE3"/>
      <stop offset="1" stop-color="#E7F3E9"/>
    </linearGradient>

    <radialGradient id="sunGlow">
      <stop offset="0" stop-color="#FFF2AE" stop-opacity=".68"/>
      <stop offset=".42" stop-color="#FFE59A" stop-opacity=".30"/>
      <stop offset="1" stop-color="#FFE59A" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".88"/>
      <stop offset=".7" stop-color="#F9FCF8" stop-opacity=".70"/>
      <stop offset="1" stop-color="#DCECEA" stop-opacity=".48"/>
    </linearGradient>

    <linearGradient id="cloudSoft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".62"/>
      <stop offset="1" stop-color="#E9F5F2" stop-opacity=".32"/>
    </linearGradient>

    <filter id="cloudBlur" x="-20%" y="-30%" width="140%" height="170%">
      <feGaussianBlur stdDeviation="1.1"/>
    </filter>

    <style>
      .bird {
        fill: none;
        stroke: #3D6870;
        stroke-width: 1.35;
        stroke-linecap: round;
      }
    </style>
  </defs>

  <!-- Sky -->
  <rect width="320" height="186" fill="url(#sky)"/>

  <!-- Sun: same position as the night moon -->
  <circle cx="268.80" cy="52.08" r="42" fill="url(#sunGlow)"/>

  <g stroke="#FFE49A" stroke-width="1.6" stroke-linecap="round" opacity=".58">
    <line x1="268.8" y1="23" x2="268.8" y2="17"/>
    <line x1="268.8" y1="81" x2="268.8" y2="87"/>
    <line x1="239.8" y1="52.08" x2="233.8" y2="52.08"/>
    <line x1="297.8" y1="52.08" x2="303.8" y2="52.08"/>
    <line x1="248.3" y1="31.6" x2="243.9" y2="27.2"/>
    <line x1="289.3" y1="72.6" x2="293.7" y2="77"/>
    <line x1="289.3" y1="31.6" x2="293.7" y2="27.2"/>
    <line x1="248.3" y1="72.6" x2="243.9" y2="77"/>
  </g>

  <circle cx="268.80" cy="52.08" r="13" fill="#FFD66B"/>
  <circle cx="265.1" cy="48.1" r="4.8" fill="#FFE9A2" opacity=".72"/>

  <!-- High wispy cloud, fully inside canvas -->
  <g opacity=".58" filter="url(#cloudBlur)">
    <path d="M18 47
             C28 40 40 40 49 45
             C53 35 63 30 73 34
             C81 25 96 28 101 39
             C112 37 122 42 126 51
             C105 57 42 57 18 53 Z"
          fill="url(#cloudSoft)"/>
  </g>

  <!-- Main left cloud, larger and more readable -->
  <g opacity=".82">
    <path d="M-18 116
             C-6 105 8 103 21 109
             C25 96 38 89 51 95
             C59 82 77 84 85 98
             C98 94 111 101 116 113
             C128 112 139 118 144 129
             C126 138 22 140 -18 132 Z"
          fill="url(#cloud)"/>
    <path d="M-8 127
             C25 134 99 133 137 126
             C125 137 27 142 -8 135 Z"
          fill="#D6E8E6" opacity=".34"/>
  </g>

  <!-- Middle floating cloud -->
  <g opacity=".64">
    <path d="M112 91
             C121 84 132 84 140 88
             C144 79 154 74 163 79
             C169 69 184 72 188 83
             C198 81 208 87 211 96
             C194 101 128 101 112 97 Z"
          fill="url(#cloud)"/>
  </g>

  <!-- RIGHT CLOUD: moved inward/up so it cannot clip -->
  <g opacity=".82">
    <path d="M203 130
             C214 120 227 119 237 125
             C241 113 253 107 264 113
             C271 101 288 104 294 117
             C305 115 316 121 321 131
             C326 140 321 149 314 153
             L205 153
             C199 147 198 137 203 130 Z"
          fill="url(#cloud)"/>

    <path d="M208 145
             C235 150 288 149 318 142
             C313 152 231 158 208 150 Z"
          fill="#D3E7E5" opacity=".34"/>
  </g>

  <!-- Soft distant horizon cloud -->
  <path d="M0 163
           C25 157 48 158 67 164
           C88 157 109 158 129 164
           C150 158 172 159 192 165
           C214 158 238 159 258 165
           C281 159 304 160 320 165
           L320 186 L0 186 Z"
